apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-webapp
  namespace: default
  labels:
    app: demo-webapp
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-webapp
  template:
    metadata:
      labels:
        app: demo-webapp
    spec:
      containers:
        - name: web-app
          image: nginx:1.14.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            # Common misconfigurations for demo / Trivy to detect:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
---
apiVersion: v1
kind: Service
metadata:
  name: demo-webapp-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: demo-webapp
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
