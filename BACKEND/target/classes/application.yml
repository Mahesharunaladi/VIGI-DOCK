server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: vigidock-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

# Custom properties expected by the platform services
gemini:
  api:
    key: ${GEMINI_API_KEY:}

trivy:
  binary:
    path: ${TRIVY_BINARY_PATH:trivy}

vigidock:
  scanner:
    trivy-path: ${trivy.binary.path:trivy}
    timeout-seconds: 300
    upload-dir: ${VIGIDOCK_UPLOAD_DIR:src/main/resources/uploads}
  ai:
    gemini:
      api-key: ${gemini.api.key:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      api-url: https://generativelanguage.googleapis.com/v1beta/models
  epss:
    api-url: https://api.first.org/data/v1/epss
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.vigidock: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/vigidock;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: VigiDockHikariPool
      max-lifetime: 2000000
      connection-timeout: 30000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vigidock}
    username: ${SPRING_DATASOURCE_USERNAME:vigidock}
    password: ${SPRING_DATASOURCE_PASSWORD:vigidock}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: VigiDockPostgresPool
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
